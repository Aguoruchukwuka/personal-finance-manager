{% extends "base.html" %}
{% block title %}Sign Up{% endblock %}
{% block content %}
<div class="auth-card">
    <h1>Create your account</h1>
    <p class="subtitle">Start tracking your income and expenses.</p>
    <form method="POST">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" value="{{ username or '' }}" required autofocus>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" value="{{ email or '' }}" required>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" required minlength="6">

        <label for="confirm_password">Confirm Password</label>
        <input type="password" id="confirm_password" name="confirm_password" required minlength="6">

        <button type="submit" class="btn-primary">Sign Up</button>
    </form>
    <p class="auth-switch">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
</div>
{% endblock %}
