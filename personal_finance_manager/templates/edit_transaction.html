{% extends "base.html" %}
{% block title %}Edit Transaction{% endblock %}
{% block content %}
<div class="form-card">
    <h1>Edit Transaction</h1>
    <form method="POST">
        <label for="type">Type</label>
        <select id="type" name="type" required>
            <option value="income" {% if transaction.type == 'income' %}selected{% endif %}>Income</option>
            <option value="expense" {% if transaction.type == 'expense' %}selected{% endif %}>Expense</option>
        </select>

        <label for="amount">Amount (₦)</label>
        <input type="number" id="amount" name="amount" step="0.01" min="0.01" value="{{ transaction.amount }}" required>

        <label for="category_id">Category</label>
        <select id="category_id" name="category_id">
            <option value="">Uncategorized</option>
            {% for c in categories %}
            <option value="{{ c.id }}" {% if transaction.category_id == c.id %}selected{% endif %}>{{ c.name }}</option>
            {% endfor %}
        </select>

        <label for="date">Date</label>
        <input type="date" id="date" name="date" value="{{ transaction.date.strftime('%Y-%m-%d') }}" required>

        <label for="description">Description</label>
        <input type="text" id="description" name="description" value="{{ transaction.description or '' }}">

        <div class="form-actions">
            <button type="submit" class="btn-primary">Update Transaction</button>
            <a href="{{ url_for('transactions_list') }}" class="btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
